events {}

http {

    # Docker's embedded DNS — re-resolve every 10s so recreated
    # api/frontend containers (new IPs) never leave nginx dialing stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        client_max_body_size 50M;

        location / {
            # variable forces runtime DNS lookup via resolver above
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Wajib ditambahkan agar API tahu asalnya adalah HTTPS dari FortiGate
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/ {
            set $api_upstream http://api:8080;
            proxy_pass $api_upstream;
            # Wajib ditambahkan agar API tahu asalnya adalah HTTPS dari FortiGate
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
